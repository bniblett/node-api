version: "3.8"
services:
    server:
        image: node:16.15.0
        volumes:
            - ./:/usr/src/app/
            - /usr/src/app/node_modules
        working_dir: /usr/src/app
        links:
            - database
        networks:
            - default
        ports:
            # HOST:CONTAINER
            - 3000:3000
        depends_on:
            - database
        command: >
            bash -c "npm install
            && npm run start:nodemon"
    database:
        image: mysql:8.0
        ports:
            - 3306:3306
        command: --default-authentication-plugin=mysql_native_password
        environment:
            MYSQL_DATABASE: _default
            MYSQL_USER: develop
            MYSQL_PASSWORD: pk9xk3iiwi
            MYSQL_ROOT_PASSWORD: d3qkjdjbtp
        volumes:
            - ./mysql-dump:/docker-entrypoint-initdb.d
            - ./conf:/etc/mysql/conf.d
            - persistent:/var/lib/mysql
        networks:
            - default
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        links:
              # service : alias
            - database:db
        ports:
            - 8080:80
        environment:
            MYSQL_USER: develop
            MYSQL_PASSWORD: pk9xk3iiwi
            MYSQL_ROOT_PASSWORD: d3qkjdjbtp
        depends_on:
            - database
volumes:
    persistent: